spring.application.name=app

# Lê o arquivo .env da pasta do back-end, se existir (formato CHAVE=valor).
# Variáveis de ambiente de verdade (ex.: docker compose) continuam tendo prioridade.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/maisedu}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
# Os controllers convertem entidades em DTOs depois que o service retorna; o Open Session in View
# mantém a sessão aberta até o fim da requisição para carregar as associações preguiçosas.
spring.jpa.open-in-view=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Carrega coleções preguiçosas em lotes (alternativas das questões, por exemplo) e evita N+1.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.output.ansi.enabled=always

# Atrás de um proxy reverso (nginx do docker compose), use FORWARD_HEADERS_STRATEGY=native:
# o Tomcat passa a usar o IP real do cliente só quando o cabeçalho vem de um proxy interno confiável.
# Sem proxy, mantenha "none" para que ninguém forje o IP gravado na auditoria via X-Forwarded-For.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

maisedu.jwt.secret=${JWT_SECRET}
maisedu.jwt.expiracao-minutos=120
maisedu.jwt.cookie-nome=maisedu_token
maisedu.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
maisedu.login.max-tentativas=5
maisedu.login.bloqueio-minutos=15

# Origens do front-end autorizadas a chamar a API diretamente (separadas por vírgula).
# Com o proxy /api do Vite ou do nginx, front e API ficam na mesma origem e o CORS nem é usado.
maisedu.cors.origens=${CORS_ORIGENS:http://localhost:5173}

maisedu.resend.api-key=${RESEND_API_KEY:}
maisedu.resend.remetente=${RESEND_REMETENTE:MaisEdu <onboarding@resend.dev>}
# Só para desenvolvimento: sem chave do Resend, escreve o conteúdo do e-mail (com a senha) no log.
maisedu.email.registrar-no-log-sem-resend=false

# Versão vigente dos Termos de Uso / Política de Privacidade. Ao publicar uma versão nova dos
# documentos, incremente este número: todos os usuários terão de aceitar de novo no próximo acesso.
maisedu.termos.versao-atual=1

# Retenção dos registros de auditoria (LGPD: necessidade). Rotina diária às 03:30.
maisedu.auditoria.retencao-dias=365
maisedu.auditoria.limpeza-cron=0 30 3 * * *

# Parâmetros do motor de prática adaptativa (RN06).
maisedu.adaptativo.maximo-topicos=3
maisedu.adaptativo.questoes-por-pratica=10
maisedu.adaptativo.minimo-respostas-dominio=5
maisedu.adaptativo.percentual-dominio=70
