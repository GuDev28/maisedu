# Perfil "test": ativado com @ActiveProfiles("test") nos testes de integracao.
# Sobrescreve o application.properties apenas no que muda para o ambiente de teste.

# Banco de teste: H2 em memoria, separado do PostgreSQL de desenvolvimento.
# O schema e criado a partir das entidades no inicio e descartado no fim (create-drop).
spring.datasource.url=jdbc:h2:mem:maisedutestdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# As migrations V1..V6 usam recursos exclusivos do PostgreSQL (EXCLUDE, indice parcial,
# DEFERRABLE), por isso o Flyway fica desligado no H2. Os dados fixos que elas inserem
# (roles e lista de topicos) vem do seed-teste.sql, executado depois que o Hibernate cria o schema.
spring.flyway.enabled=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed-teste.sql
spring.sql.init.encoding=UTF-8

# Segredo do JWT usado so nos testes (precisa ter pelo menos 32 bytes).
maisedu.jwt.secret=segredo-dos-testes-de-integracao-maisedu-0123456789

# Sem chave do Resend: nos testes o ResendEmailService e substituido por um mock (@MockitoBean).
maisedu.resend.api-key=
