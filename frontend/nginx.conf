server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: /api/auth/login -> http://backend:8080/auth/login
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Front e API estão na mesma origem, então estas chamadas nunca são CORS. Sem esta linha o
        # navegador manda "Origin: http://localhost:8081" nos POST/PUT/DELETE; atrás do proxy o
        # Spring enxerga outra porta, trata como CORS de origem não autorizada e responde 403.
        proxy_set_header Origin "";
    }

    # SPA: qualquer outra rota devolve o index.html
    location / {
        try_files $uri /index.html;
    }
}